name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate a sanitized diagnostic log
        run: python src/diagnostic_log_builder.py --ticket-id LAB-AI-001 --device LAB-DEVICE --symptom-file examples/raw-symptom.txt --out reports/diagnostic-log.md
